steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vibe-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/vibe-backend:latest', './backend']
    id: 'build-backend'

  # 2. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vibe-backend:$COMMIT_SHA']
    id: 'push-backend-commit'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vibe-backend:latest']
    id: 'push-backend-latest'

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'vibe-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vibe-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      - 'GEMINI_MODEL=gemini-2.5-flash'
    id: 'deploy-backend'

  # 4. Get the Backend URL dynamically
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run services describe vibe-backend --region us-central1 --format 'value(status.url)' > /workspace/backend_url.txt
    id: 'get-backend-url'

  # 5. Build Frontend Image using the retrieved Backend URL
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        echo "Backend URL is: $$BACKEND_URL"
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=$$BACKEND_URL \
          -t gcr.io/$PROJECT_ID/vibe-frontend:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/vibe-frontend:latest \
          ./frontend
    id: 'build-frontend'

  # 6. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vibe-frontend:$COMMIT_SHA']
    id: 'push-frontend-commit'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vibe-frontend:latest']
    id: 'push-frontend-latest'

  # 7. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'vibe-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vibe-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'

images:
  - 'gcr.io/$PROJECT_ID/vibe-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/vibe-backend:latest'
  - 'gcr.io/$PROJECT_ID/vibe-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/vibe-frontend:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
